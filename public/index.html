l joint planning."],"220308":["Der Nachfolger von Terra Mystica im All: Völker mit ganz eigenen Fähigkeiten besiedeln Planeten, forschen und terraformen – tiefe Strategie ganz ohne Würfelglück.","Terra Mystica's successor in space: factions with unique abilities colonize planets, research and terraform – deep strategy without any dice luck."],"12333":["Der Kalte Krieg für zwei: USA und UdSSR ringen über 45 Jahre mit historischen Ereigniskarten um Einfluss in der Welt.","The Cold War for two: the USA and USSR fight for global influence over 45 years, driven by historical event cards."],"173346":["Das Zwei-Personen-Spiel zu 7 Wonders: Karten aus einer offenen Auslage nehmen, Weltwunder bauen und auf einem von drei Wegen gewinnen.","The two-player take on 7 Wonders: take cards from an open layout, build wonders and win in one of three ways."],"96848":["Episches Abenteuer für 1–4: Als Magierritter erkundet ihr das Land, kämpft und verbessert euer Deck – anspruchsvoll und sehr taktisch.","Epic adventure for 1–4 players: explore the land, fight and improve your deck as a Mage Knight – demanding and highly tactical."],"266192":["Lockt Vögel in eure Lebensräume: Jede Vogelkarte bringt Fähigkeiten mit, die sich zu Kettenreaktionen verbinden. Kennerspiel des Jahres 2019.","Attract birds to your wildlife preserves: each bird adds abilities that chain into combos. A modern engine-building classic."],"3076":["Klassiker der Rollenwahl: Ihr legt Plantagen und Gebäude in der Kolonie an, produziert Waren und verschifft sie nach Europa.","A role-selection classic: build plantations and buildings in the colony, produce goods and ship them back to Europe."],"231733":["Viktorianisches England à la Jane Austen: Ihr richtet Feste aus, baut euer Anwesen aus und sucht eine gute Partie für eure Familie.","Victorian England in the spirit of Jane Austen: host social events, expand your estate and seek a good match for your family."],"255984":["Kooperatives Erzählabenteuer: Eure Schiffscrew strandet in einer fremden Welt und erkundet sie über einen Atlas voller Geschichten.","Cooperative storybook adventure: your ship's crew is stranded in a strange world and explores it through an atlas full of encounters."],"413246":["Kooperatives Deduktionsspiel: Gemeinsam entschärft ihr Bomben und findet ohne viel Absprache heraus, wer welches Kabel hat. Spiel des Jahres 2025.","Cooperative deduction: defuse bombs together by working out who holds which wire – with only limited communication."],"244521":["Push your Luck im Hexenkessel: Ihr zieht Zutaten aus eurem Beutel – aber zu viele Knallerbsen lassen den Kessel explodieren. Kennerspiel des Jahres 2018.","Push-your-luck potion brewing: draw ingredients from your bag into the pot – but too many cherry bombs and it explodes."],"200680":["Ihr führt einen Bauernhof im 17. Jahrhundert: Felder pflügen, Tiere halten, die Familie vergrößern – und alle rechtzeitig satt bekommen.","Run a 17th-century farm: plough fields, raise animals, grow your family – and make sure everyone gets fed in time."],"13":["Der Klassiker: Rohstoffe erwürfeln, geschickt handeln und Siedlungen, Städte und Straßen auf der Insel Catan bauen.","The classic: roll for resources, trade cleverly and build settlements, cities and roads on the island of Catan."],"30549":["Kooperativ gegen die Zeit: Gemeinsam reist ihr um die Welt, behandelt Seuchen und entwickelt Heilmittel, bevor die Ausbrüche überhandnehmen.","A cooperative race against time: travel the world, treat diseases and find cures before outbreaks get out of hand."],"68448":["Draften für bis zu sieben: In drei Zeitaltern wählt ihr gleichzeitig Karten und baut eure antike Zivilisation samt Weltwunder aus.","Drafting for up to seven: over three ages, pick cards simultaneously to develop your ancient civilization and its wonder."],"230802":["Elegantes Legespiel: Ihr nehmt farbige Fliesen aus der Mitte und gestaltet die Wand eines Palasts – schnell erklärt, knifflig gespielt. Spiel des Jahres 2018."   let data = null; try { data = await res.json(); } catch (e) {}
