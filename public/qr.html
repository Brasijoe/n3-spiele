<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Partie eintragen – Aushang</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style id="page">@page { size: A4 portrait; margin: 12mm; }</style>
<style>
:root { --s: 1; --accent: #f09b19; --ink: #1b1b1b; --muted: #555; --band: #1b1b1b; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body { margin: 0; background: #e9e9e9; color: var(--ink); font-family: Karla, system-ui, sans-serif; }
.bar { display: flex; gap: 10px; justify-content: center; align-items: center; padding: 16px; flex-wrap: wrap; text-align: center; }
.bar button { font: 700 16px Karla, sans-serif; min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: var(--accent); color: var(--ink); cursor: pointer; }
.bar span { font-size: 14px; color: var(--muted); }
.fmt { display: inline-flex; border: 1px solid #bbb; border-radius: 8px; overflow: hidden; }
.bar .fmt button { background: #fff; border-radius: 0; min-width: 56px; padding: 0 14px; }
.bar .fmt button[aria-pressed=true] { background: var(--ink); color: #fff; }
.sheet { width: calc(210mm * var(--s)); height: calc(296mm * var(--s)); margin: 0 auto 24px; background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; padding: calc(16mm * var(--s)) calc(16mm * var(--s)) calc(14mm * var(--s)); gap: calc(5mm * var(--s)); box-shadow: 0 4px 18px rgba(0,0,0,.15); overflow: hidden; }
.band { width: 100%; background: var(--band); color: #fff; border-radius: calc(6mm * var(--s)); padding: calc(7mm * var(--s)) calc(6mm * var(--s)) calc(6mm * var(--s)); }
.band small { display: block; color: var(--accent); font: 700 calc(5mm * var(--s)) Rubik, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
h1 { font: 700 calc(13mm * var(--s))/1.05 Rubik, sans-serif; margin: calc(2mm * var(--s)) 0 0; }
.sub { font-size: calc(5.6mm * var(--s)); margin: calc(2.5mm * var(--s)) 0 0; color: #e6e6e6; line-height: 1.3; }
.why { width: 100%; background: #fdecd0; color: #5a3600; border-radius: calc(4mm * var(--s)); padding: calc(4mm * var(--s)) calc(6mm * var(--s)); font-size: calc(4.8mm * var(--s)); line-height: 1.35; }
.why b { font: 700 calc(5.4mm * var(--s)) Rubik, sans-serif; display: block; margin-bottom: calc(1mm * var(--s)); color: #7a4a00; }
.qr { width: calc(var(--q, 90mm) * var(--s)); height: calc(var(--q, 90mm) * var(--s)); padding: calc(4mm * var(--s)); border: calc(1.2mm * var(--s)) solid var(--accent); border-radius: calc(5mm * var(--s)); flex: none; }
.qr svg { width: 100%; height: 100%; display: block; }
ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(5mm * var(--s)); width: 100%; }
li { background: #f5f5f5; border-radius: calc(4mm * var(--s)); padding: calc(3.5mm * var(--s)) calc(3mm * var(--s)); font-size: calc(4.4mm * var(--s)); line-height: 1.3; }
li b { display: block; font: 700 calc(8mm * var(--s)) Rubik, sans-serif; color: var(--accent); }
.thanks { font: 700 calc(6mm * var(--s)) Rubik, sans-serif; margin: auto 0 0; }
.fitting .sheet { height: calc(278mm * var(--s)) !important; } /* Messen mit Reserve: falls ein Browser eigene Ränder/Kopfzeilen druckt */
.err { max-width: 520px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; font-size: 18px; }
@media print { html, body { background: #fff; } .bar { display: none; } .sheet { box-shadow: none; margin: 0; height: calc(296mm * var(--s)); page-break-after: always; break-after: page; } .sheet:last-child { page-break-after: auto; break-after: auto; } }
</style>
</head>
<body>
<div class="bar"><span class="fmt" role="group" aria-label="Format"><button type="button" data-f="A4">A4</button><button type="button" data-f="A5">A5</button><button type="button" data-f="A6">A6</button></span><button type="button" onclick="window.print()">Drucken</button><span id="hint"></span></div>
<div id="root"></div>
<script src="vendor/qrcode.js"></script>
<script>
(function () {
  // Der Schlüssel steht nur im #-Teil der Adresse und wird nie an den Server geschickt. Auf dem Aushang steht er nur im QR-Code.
  var key = location.hash.slice(1).toLowerCase().replace(/[^a-z0-9]/g, '');
  var root = document.getElementById('root');
  if (key.length < 8) { root.innerHTML = '<p class="err">Kein Schlüssel angegeben. Diesen Aushang bitte über die Verwaltung der Spielesammlung öffnen (Eintragen per QR-Code → Aushang drucken).</p>'; document.querySelector('.bar').hidden = true; return; }
  var q = qrcode(0, 'M'); q.addData(location.origin + '/?log=' + key); q.make();
  var svg = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  var T = {
    de: { lang: 'de', kicker: 'Nerd Nexus · Spielesammlung', h: 'Partie gespielt?<br>Trag sie ein!', sub: 'Ohne Discord, ohne Konto – einfach scannen.',
      whyH: 'Wir wollen wissen, was ihr spielt!', why: 'Jede eingetragene Partie zeigt der ganzen Community, was im Club auf den Tisch kommt: die Lieblingsspiele, die Dauerbrenner und die vergessenen Schätze. Und je mehr eingetragen wird, desto besser werden Statistik und Spieletipps für alle.',
      s: ['Code mit der Handy-Kamera scannen', 'Spiel suchen, Spielerzahl und deinen Namen eintragen', 'Speichern – dauert keine Minute!'], thanks: 'Danke, dass du mitmachst! 🎲' },
    en: { lang: 'en', kicker: 'Nerd Nexus · Game collection', h: 'Played a game?<br>Log it!', sub: 'No Discord, no account – just scan.',
      whyH: 'We want to know what you play!', why: 'Every logged play shows the whole community what hits the table at the club: the favourites, the evergreens and the forgotten gems. And the more plays get logged, the better the stats and game tips get for everyone.',
      s: ['Scan the code with your phone camera', 'Find the game, enter player count and your name', 'Save – takes less than a minute!'], thanks: 'Thanks for joining in! 🎲' }
  };
  function sheet(t) {
    return '<section class="sheet" lang="' + t.lang + '">' +
      '<div class="band"><small>' + t.kicker + '</small><h1>' + t.h + '</h1><p class="sub">' + t.sub + '</p></div>' +
      '<div class="why"><b>' + t.whyH + '</b>' + t.why + '</div>' +
      '<div class="qr">' + svg + '</div>' +
      '<ol>' + t.s.map(function (x, i) { return '<li><b>' + (i + 1) + '</b>' + x + '</li>'; }).join('') + '</ol>' +
      '<p class="thanks">' + t.thanks + '</p></section>';
  }
  root.innerHTML = sheet(T.de) + sheet(T.en);

  // Format: alles ist in mm gesetzt und wird über --s skaliert (A5 = A4 × 0,707, A6 = A4 × 0,5). Gewähltes Format wird gemerkt.
  var F = { A4: 1, A5: 0.7071, A6: 0.5 };
  var SZ = { A4: '210mm 297mm', A5: '148mm 210mm', A6: '105mm 148mm' }; // als Maße, weil nicht jeder Browser „A6“ als Namen kennt
  function setFmt(f) {
    if (!F[f]) f = 'A4';
    document.documentElement.style.setProperty('--s', F[f]);
    document.getElementById('page').textContent = '@page { size: ' + SZ[f] + '; margin: 0; }'; fit();
    document.querySelectorAll('.fmt button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.f === f ? 'true' : 'false'); });
    document.getElementById('hint').textContent = '2 Seiten ' + f + ': vorne Deutsch, hinten Englisch – beidseitig drucken. Im Druckdialog: Papierformat ' + f + ', Skalierung 100 % („Tatsächliche Größe“), Kopf- und Fußzeilen aus.';
    try { localStorage.setItem('n3-qr-format', f); } catch (e) {}
  }
  // Passt alles auf die Seite? Sonst den QR-Code schrittweise verkleinern (z. B. wenn Schriften anders laufen als erwartet).
  function fit() {
    var q = 90, de = document.documentElement; de.style.setProperty('--q', q + 'mm'); de.classList.add('fitting');
    var sheets = document.querySelectorAll('.sheet');
    var over = function () { for (var i = 0; i < sheets.length; i++) { var x = sheets[i]; if (x.scrollHeight > x.clientHeight + 1) return true; } return false; };
    while (q > 45 && over()) { q -= 3; de.style.setProperty('--q', q + 'mm'); }
    de.classList.remove('fitting');
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('beforeprint', fit);
  document.querySelector('.fmt').addEventListener('click', function (e) { var b = e.target.closest('button[data-f]'); if (b) setFmt(b.dataset.f); });
  var saved = null; try { saved = localStorage.getItem('n3-qr-format'); } catch (e) {}
  setFmt(saved);
})();
</script>
</body>
</html>
