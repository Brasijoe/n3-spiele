name = "n3-spiele"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Statische Seite aus ./public; nur /api/* läuft zuerst durch den Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Nach `wrangler d1 create n3-spiele` die ausgegebene ID hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "n3-spiele"
database_id = "7ee93ce3-f3db-49cc-9edc-e6d67cd3b731"

[vars]
GEEKLIST_ID = "387061"
# Discord (öffentliche Werte). DISCORD_GUILD_ID = Server-ID; leer lassen = Befehle auf allen Servern.
DISCORD_APP_ID = "1569483072687050792"
DISCORD_PUBLIC_KEY = "406f0af0c45c85e1130fb884e163c343f2200d83ed217248701170934d2a6938"
DISCORD_GUILD_ID = "1569484372112052305"
# Optional: Kanal-ID(s), mehrere durch Komma getrennt. Gesetzt = Bot reagiert nur dort (der erste Kanal ist das Ziel für Runden von der Webseite); leer = überall auf dem Server.
DISCORD_CHANNEL_ID = "1569484372757848238"
# Link, der im Info-Fenster beim persönlichen Code erscheint (Einladungs- oder Kanallink; leer = kein Button).
DISCORD_URL = "https://discord.com/channels/1569484372112052305/1569484372757848238"
# --- VORGEMERKT für den Umzug auf den echten N3-Server (noch NICHT aktiv, Test läuft auf dem Testserver) ---
# DISCORD_GUILD_ID   = "1168441429345972285"
# DISCORD_CHANNEL_ID = "1172228534194946148"
# DISCORD_URL        = "https://discord.com/channels/1168441429345972285/1172228534194946148"  (besser: dauerhafter Einladungslink)
# Danach in der Verwaltung „Discord-Befehle registrieren“ klicken und den Bot auf den N3-Server einladen.

# Täglich 03:17 UTC: GeekList von BGG lesen und für die Verwaltung zwischenspeichern.
[triggers]
crons = ["17 3 * * *"]

# Secrets (nicht hier eintragen, sondern mit `wrangler secret put ...` oder im Cloudflare-Dashboard):
#   BGG_TOKEN    Token der BGG-XML-API
#   DISCORD_BOT_TOKEN  Bot-Token aus dem Discord Developer Portal
#   ADMIN_TOKEN  Passwort für die Verwaltungsansicht der Seite
