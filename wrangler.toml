name = "n3-spiele"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Statische Seite aus ./public; nur /api/* läuft zuerst durch den Worker.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

# Nach `wrangler d1 create n3-spiele` die ausgegebene ID hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "n3-spiele"
database_id = "7ee93ce3-f3db-49cc-9edc-e6d67cd3b731"

[vars]
GEEKLIST_ID = "387061"
# Discord (öffentliche Werte). DISCORD_GUILD_ID = Server-ID; leer lassen = Befehle auf allen Servern.
DISCORD_APP_ID = "1569483072687050792"
DISCORD_PUBLIC_KEY = "406f0af0c45c85e1130fb884e163c343f2200d83ed217248701170934d2a6938"
DISCORD_GUILD_ID = "1569484372112052305"
# Optional: Kanal-ID. Gesetzt = Bot reagiert nur in diesem Kanal; leer = überall auf dem Server.
DISCORD_CHANNEL_ID = ""

# Täglich 03:17 UTC: GeekList von BGG lesen und für die Verwaltung zwischenspeichern.
[triggers]
crons = ["17 3 * * *"]

# Secrets (nicht hier eintragen, sondern mit `wrangler secret put ...` oder im Cloudflare-Dashboard):
#   BGG_TOKEN    Token der BGG-XML-API
#   DISCORD_BOT_TOKEN  Bot-Token aus dem Discord Developer Portal
#   ADMIN_TOKEN  Passwort für die Verwaltungsansicht der Seite
